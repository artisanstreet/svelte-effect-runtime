packages:
    - "modules/svelte-effect-runtime"
    - "modules/svelte-effect-runtime-grammars"
    - "modules/svelte-effect-runtime-language-server"
    - "modules/svelte-effect-runtime-vsix"

allowBuilds:
    "@vscode/vsce-sign": false
    esbuild: true
    keytar: false
    msgpackr-extract: true
    sharp: true

catalog:
    vite: 8.2.0

minimumReleaseAgeExclude:
    - "@sveltejs/kit@3.1.0"
    - "effect@4.0.5"
    - "@effect/platform-node@4.0.5"
    - "@effect/platform-node-shared@4.0.5"

overrides:
    "@effect/platform-node-shared": "4.0.5"
    vite: "catalog:"

peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: "*"

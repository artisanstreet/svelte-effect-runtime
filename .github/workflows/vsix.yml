name: vsix

on:
  push:
    branches:
      - master
    paths:
      - modules/svelte-effect-runtime-vsix/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_version_bump:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    outputs:
      has_version_bump: ${{ steps.detect.outputs.has_version_bump }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: detect_version_bump
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_version_bump=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --unified=0 "${{ github.event.before }}" "${{ github.sha }}" -- modules/svelte-effect-runtime-vsix/package.json | grep -Eq '^[+-][[:space:]]*"version":[[:space:]]*"'; then
            echo "has_version_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_version_bump=false" >> "$GITHUB_OUTPUT"
          fi

  lint_and_test:
    needs: detect_version_bump
    if: needs.detect_version_bump.outputs.has_version_bump == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: enable_corepack
        run: corepack enable

      - name: install_vite_plus
        shell: bash
        run: |
          curl -fsSL https://vite.plus | bash
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - name: install_dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: lint
        run: corepack pnpm run lint

      - name: test_lsp
        run: corepack pnpm run test

  package_vsix:
    needs:
      - detect_version_bump
      - lint_and_test
    if: needs.detect_version_bump.outputs.has_version_bump == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: enable_corepack
        run: corepack enable

      - name: install_vite_plus
        shell: bash
        run: |
          curl -fsSL https://vite.plus | bash
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - name: install_dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: package_vsix
        run: corepack pnpm --dir modules/svelte-effect-runtime-vsix run package

      - name: upload_vsix
        uses: actions/upload-artifact@v4
        with:
          name: svelte-effect-runtime-vscode
          path: .dist/svelte-effect-runtime-vsix/*.vsix
          if-no-files-found: error

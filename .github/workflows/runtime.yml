name: runtime

on:
  push:
    branches:
      - master
    paths:
      - modules/svelte-effect-runtime-grammars/package.json
      - modules/svelte-effect-runtime/package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_version_bump:
    runs-on: ubuntu-latest

    outputs:
      has_version_bump: ${{ steps.detect.outputs.has_version_bump }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: detect_version_bump
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_version_bump=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --unified=0 "${{ github.event.before }}" "${{ github.sha }}" -- \
            modules/svelte-effect-runtime-grammars/package.json \
            modules/svelte-effect-runtime/package.json \
            | grep -Eq '^[+-][[:space:]]*"version":[[:space:]]*"'
          then
            echo "has_version_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_version_bump=false" >> "$GITHUB_OUTPUT"
          fi

  lint_and_test:
    needs: detect_version_bump
    if: needs.detect_version_bump.outputs.has_version_bump == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: enable_corepack
        run: corepack enable

      - name: install_vite_plus
        shell: bash
        run: |
          curl -fsSL https://vite.plus | bash
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - name: install_dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: lint
        run: corepack pnpm run lint

      - name: test
        run: corepack pnpm run test

  build_runtime:
    needs:
      - detect_version_bump
      - lint_and_test
    if: needs.detect_version_bump.outputs.has_version_bump == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: enable_corepack
        run: corepack enable

      - name: install_vite_plus
        shell: bash
        run: |
          curl -fsSL https://vite.plus | bash
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - name: install_dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: build_runtime
        run: corepack pnpm --dir modules/svelte-effect-runtime run build

      - name: pack_runtime
        run: vp node build/pack.ts svelte-effect-runtime

      - name: publish_runtime_to_npm
        if: github.ref == 'refs/heads/master'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          RUNTIME_VERSION="$(node -p "require('./modules/svelte-effect-runtime/package.json').version")"

          if corepack pnpm view "svelte-effect-runtime@${RUNTIME_VERSION}" version >/dev/null 2>&1; then
            echo "svelte-effect-runtime@${RUNTIME_VERSION} is already published. Skipping npm publish."
            exit 0
          fi

          if [ -n "${NPM_TOKEN}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${HOME}/.npmrc"
          fi

          RUNTIME_TGZ="$(find .dist/svelte-effect-runtime -maxdepth 1 -name '*.tgz' -print -quit)"
          corepack pnpm publish "$RUNTIME_TGZ" --access public --provenance --no-git-checks

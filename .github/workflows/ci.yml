        steps:
            - name: Checkout selected commit
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Setup workspace
              uses: ./.github/actions/setup
            - name: Download candidate bundle
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-candidate-${{ needs.plan.outputs.version }}-${{ github.sha }}
                  path: release-candidate
            - name: Upload exact GitHub assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  vp node build/release/cli.ts promote
                  --plan release-candidate/release-plan.json
                  --manifest release-candidate/artifact-manifest.json
                  --artifact-dir release-candidate/artifacts
                  --notes release-candidate/release-notes.md
                  --repository "${{ github.repository }}"
                  --state-output release-state.json
                  --phase github-assets
                  --dry-run false
            - name: Upload GitHub asset evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: promotion-phase-github-assets-${{ github.run_id }}
                  path: release-state.json
                  if-no-files-found: warn
                  retention-days: 90

    openvsx_publish:
        name: Publish OpenVSX
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/candidate' && (inputs.mode == 'release' || inputs.mode == 'resume')
        needs:
            - plan
            - npm_publish
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 15
        environment:
            name: release
            deployment: false
        permissions:
            actions: read
            contents: read
        steps:
            - name: Checkout selected commit
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Setup workspace
              uses: ./.github/actions/setup
            - name: Download candidate bundle
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-candidate-${{ needs.plan.outputs.version }}-${{ github.sha }}
                  path: release-candidate
            - name: Publish exact VSIX to OpenVSX
              env:
                  GH_TOKEN: ${{ github.token }}
                  OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
              run: >-
                  vp node build/release/cli.ts promote
                  --plan release-candidate/release-plan.json
                  --manifest release-candidate/artifact-manifest.json
                  --artifact-dir release-candidate/artifacts

    github_finalize:
        name: Finalize GitHub release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/candidate' && (inputs.mode == 'release' || inputs.mode == 'resume')
        needs:
            - plan
            - npm_publish
            - github_assets
            - openvsx_publish
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 15
        permissions:
            actions: read
            contents: write
        steps:
            - name: Checkout selected commit
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Setup workspace
              uses: ./.github/actions/setup
            - name: Download candidate bundle
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-candidate-${{ needs.plan.outputs.version }}-${{ github.sha }}
                  path: release-candidate
            - name: Finalize verified GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  vp node build/release/cli.ts promote
                  --plan release-candidate/release-plan.json
                  --manifest release-candidate/artifact-manifest.json
                  --artifact-dir release-candidate/artifacts
                  --notes release-candidate/release-notes.md
                  --repository "${{ github.repository }}"
                  --state-output release-state.json
                  --phase github-finalize

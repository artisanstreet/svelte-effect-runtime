            - name: Upload finalization evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: promotion-phase-github-finalize-${{ github.run_id }}
                  path: release-state.json
                  if-no-files-found: warn
                  retention-days: 90

    promotion_evidence:
        name: Inspect promotion state
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/candidate' && (inputs.mode == 'release' || inputs.mode == 'resume')
        needs:
            - plan
            - candidate_verified
            - github_prepare
            - npm_publish
            - github_assets
            - openvsx_publish
            - github_finalize
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
        steps:
            - name: Checkout selected commit
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Setup workspace
              uses: ./.github/actions/setup
            - name: Download candidate bundle
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-candidate-${{ needs.plan.outputs.version }}-${{ github.sha }}
                  path: release-candidate
            - name: Inspect exact publication state
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  vp node build/release/cli.ts inspect
                  --plan release-candidate/release-plan.json
                  --manifest release-candidate/artifact-manifest.json
                  --artifact-dir release-candidate/artifacts
                  --notes release-candidate/release-notes.md
                  --repository "${{ github.repository }}"
                  --output release-state.json
            - name: Upload consolidated promotion evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: promotion-state-${{ github.run_id }}
                  path: release-state.json
                  if-no-files-found: warn
                  retention-days: 90

    report:
        name: Report
        if: always()
        needs:
            - plan
            - staging_verified
            - candidate_verified
            - dry_run
            - promotion_evidence
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
            deployments: read
        steps:
            - name: Checkout selected commit
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Setup workspace
              uses: ./.github/actions/setup
            - name: Download promotion evidence
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: promotion-state-${{ github.run_id }}
                  path: release-report
            - name: Download provider timing evidence
              if: github.event_name == 'workflow_dispatch' && inputs.mode != 'dry-run'
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  pattern: promotion-phase-*-${{ github.run_id }}
                  path: release-report/phases
            - name: Download release plan
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-plan-${{ github.run_id }}
                  path: release-report/plan
            - name: Download candidate identity
              if: github.event_name == 'workflow_dispatch'
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-candidate-${{ needs.plan.outputs.version }}-${{ github.sha }}
                  path: release-report/candidate
            - name: Report timing and release state
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  vp node build/ci/report.ts
                  --state release-report/release-state.json
                  --plan release-report/plan/release-plan.json
                  --manifest release-report/candidate/artifact-manifest.json
                  --phases release-report/phases
                  --output release-report/timing.json
            - name: Upload timing evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: timing-${{ github.run_id }}
                  path: release-report/timing.json
                  if-no-files-found: warn
                  retention-days: 90
